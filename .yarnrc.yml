# Modelled on upstream's .yarnrc.yml (ADR-0009): node-modules linker and a one-week minimal age gate for new
# package versions. Yarn itself is provided by corepack through the root package.json "packageManager" field.
enableGlobalCache: false

# Install scripts of third-party packages stay off (ADR-0009 A4; upstream turns them on, we don't). The one reviewed
# allow-list is "dependenciesMeta" in the root package.json: today only sqlite3 (`built: true`), whose native binding
# the Joplin CLI needs (M1-AC23). Explicit here so a change of yarn's default can't turn every script back on.
enableScripts: false

enableTelemetry: false

nmHoistingLimits: workspaces

nodeLinker: node-modules

npmMinimalAgeGate: 1w
