# Modelled on upstream's .yarnrc.yml (ADR-0009): node-modules linker and a one-week minimal age gate for new
# package versions. Yarn itself is provided by corepack through the root package.json "packageManager" field.
enableGlobalCache: false

enableTelemetry: false

nmHoistingLimits: workspaces

nodeLinker: node-modules

npmMinimalAgeGate: 1w
